name: Build Flutter APK & Web

on:
  push:
    branches:
      - final-delivery  # الفرع اللي تبغى تشغل عليه البناء

jobs:
  build-flutter:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ سحب المشروع من GitHub
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2️⃣ تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 3️⃣ تثبيت الاعتمادات (Dependencies) لـ Flutter
      - name: Install dependencies
        run: flutter pub get
        working-directory: teacher_app

      # 4️⃣ بناء APK
      - name: Build APK
        run: flutter build apk --release
        working-directory: teacher_app

      # 5️⃣ بناء Flutter Web
      - name: Build Web
        run: flutter build web --release
        working-directory: teacher_app

      # 6️⃣ رفع APK كـ Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-app-apk
          path: teacher_app/build/app/outputs/flutter-apk/app-release.apk

      # 7️⃣ رفع ملفات Web كـ Artifact
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-web
          path: teacher_app/build/web
